[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-routing-models"
authors = [
    { name = "Arturo" }
]
maintainers = [
    { name = "Arturo" },
]
description = "A NetBox Routing Plugin"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["netbox-plugin", ]
version = "1.0.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    'Development Status :: 4 - Beta',
    'Framework :: Django',
    'Framework :: Django :: 6',
    'Framework :: Django :: 6.0',
    'Framework :: Django :: 6.1',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Intended Audience :: System Administrators',
    'Intended Audience :: Telecommunications Industry',
    'Natural Language :: English',
    "Programming Language :: Python :: 3",
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: System',
    'Topic :: System :: Hardware',
    'Topic :: System :: Hardware :: Mainframes',
    'Topic :: System :: Networking',
    'Topic :: System :: Networking :: Firewalls',
    'Topic :: System :: Operating System',
    'Topic :: System :: Systems Administration',
]
dependencies = [
    'django-polymorphic',
    'regex',
]

[project.urls]
Documentation = "https://github.com/baldoarturo/netbox-routing-protocols/blob/main/README.md"
Source = "https://github.com/baldoarturo/netbox-routing-protocols"
Tracker = "https://github.com/baldoarturo/netbox-routing-protocols/issues"

[tool.setuptools.packages.find]
include = ["netbox_routing_protocols*"]
exclude = ["netbox_routing_protocols.tests", "netbox_routing_protocols.tests.*"]

[tool.black]
skip-string-normalization = 1
fast = 1
check = 0
diff = 0
extend-exclude = '''
/(
    | netbox_routing_protocols/migrations
)/
'''
