name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

# The test suite needs a full NetBox install and its migrated database
# (~10 minutes on a runner), so it is run locally before pushing. CI only lints.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install ruff black

      - name: Check Ruff
        run: ruff check --config ruff.toml netbox_routing/

      - name: Check Black
        run: black --check --skip-string-normalization netbox_routing
