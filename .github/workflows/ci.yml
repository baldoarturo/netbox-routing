name: CI
on:
  # Every change is linted in its pull request. A push to main only runs when the hooks
  # change, which refreshes the pre-commit cache of the default branch (the one pull
  # requests can read).
  push:
    branches: [ main ]
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/ci.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

# The test suite needs a full NetBox install and its migrated database
# (~10 minutes on a runner), so it is run locally before pushing. CI only lints.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache the pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run the hooks (Ruff and Black)
        run: pre-commit run --all-files --show-diff-on-failure
