name: NetBox schema cache

# Builds a schema-only dump of a fully migrated NetBox database (without this
# plugin) and stores it with actions/cache. A cache saved from main is readable
# by every pull request and release; one saved from a PR or tag is not.
# Consumers: release-tests.yml (restore + --keepdb, so only the plugin
# migrations run). The key is the hash of NetBox's migration files, so it
# refreshes by itself when NetBox changes.
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/netbox-schema-cache.yml
      - .github/configuration.testing.py
  schedule:
    - cron: '0 6 * * 1'  # weekly, keeps the cache from expiring (7 days unused)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NETBOX_CONFIGURATION: netbox.configuration_testing
      CI_BASE_SCHEMA: '1'
      PGPASSWORD: netbox
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out NetBox
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: main
          path: netbox

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          path: netbox-routing

      - name: Look for an existing cache
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: netbox-base-schema.dump
          key: netbox-schema-v1-pg16-py3.12-${{ hashFiles('netbox/requirements.txt', 'netbox/netbox/**/migrations/*.py') }}
          lookup-only: true

      - name: Set up Python 3.12
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & set up configuration
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          cp -f netbox-routing/.github/configuration.testing.py netbox/netbox/netbox/configuration_testing.py

      - name: Migrate NetBox (without this plugin) and dump it
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          python netbox/netbox/manage.py migrate
          pg_dump -h localhost -U netbox -Fc netbox -f netbox-base-schema.dump
          ls -la netbox-base-schema.dump

      - name: Save cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: netbox-base-schema.dump
          key: netbox-schema-v1-pg16-py3.12-${{ hashFiles('netbox/requirements.txt', 'netbox/netbox/**/migrations/*.py') }}
