name: Release tests

# Full test suite against a fresh NetBox. Too slow (~10 min, mostly building the
# NetBox test database) to run on every PR, so it runs when a release is
# published, or manually. Day-to-day tests are run locally before pushing.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NETBOX_CONFIGURATION: netbox.configuration_testing
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out NetBox
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: main
          path: netbox

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          path: netbox-routing

      - name: Install dependencies & set up configuration
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install tblib
          pip install -e netbox-routing
          cp -f netbox-routing/.github/configuration.testing.py netbox/netbox/netbox/configuration_testing.py

      - name: Restore cached NetBox schema (built on main)
        id: schema-cache
        uses: actions/cache/restore@v4
        with:
          path: netbox-base-schema.dump
          key: netbox-schema-v1-pg16-py3.12-${{ hashFiles('netbox/requirements.txt', 'netbox/netbox/**/migrations/*.py') }}

      - name: Load cached schema into the test database
        if: steps.schema-cache.outputs.cache-hit == 'true'
        env:
          PGPASSWORD: netbox
        run: |
          createdb -h localhost -U netbox test_netbox
          pg_restore -h localhost -U netbox -d test_netbox --no-owner netbox-base-schema.dump

      - name: Run tests (cached schema, only plugin migrations)
        if: steps.schema-cache.outputs.cache-hit == 'true'
        run: python netbox/netbox/manage.py test netbox-routing/netbox_routing --parallel --keepdb

      - name: Run tests (no cache, full NetBox migrations)
        if: steps.schema-cache.outputs.cache-hit != 'true'
        run: python netbox/netbox/manage.py test netbox-routing/netbox_routing --parallel
