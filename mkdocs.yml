site_name: NetBox Routing Protocols
site_description: Document the routing configuration of your network in NetBox
repo_url: https://github.com/baldoarturo/netbox-routing-protocols
repo_name: baldoarturo/netbox-routing-protocols
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
validation:
  links:
    anchors: warn
    absolute_links: warn
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Using the plugin: using.md
  - Routing objects: routing-objects.md
  - BFD: bfd.md
  - Protocols:
      - Static routes: protocols/static.md
      - BGP: protocols/bgp.md
      - OSPF: protocols/ospf.md
      - IS-IS: protocols/isis.md
      - EIGRP: protocols/eigrp.md
  - RFC index: rfc-index.md
  - Development: development.md
