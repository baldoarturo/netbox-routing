exclude = [
    '.github',
]
line-length = 120
target-version = "py310"
output-format = "github"

[lint]
extend-select = ["E1", "E2", "E3", "E501", "W"]
ignore = ["I001", "RUF012", "RUF022", "SIM102", "UP006", "UP007", "F403", "F405"]
preview = true

[lint.per-file-ignores]
"template_code.py" = ["E501"]
"netbox_routing_protocols/graphql/filter_mixins.py" = ["F821", "RUF009"]
"netbox_routing_protocols/graphql/bgp/types.py" = ["F821", ]
"netbox_routing_protocols/graphql/community/types.py" = ["F821", ]
"netbox_routing_protocols/graphql/eigrp/types.py" = ["F821", ]
"netbox_routing_protocols/graphql/isis/types.py" = ["F821", ]
"netbox_routing_protocols/graphql/objects/types.py" = ["F821", ]
"netbox_routing_protocols/graphql/ospf/types.py" = ["F821", ]
"netbox_routing_protocols/graphql/static/types.py" = ["F821", ]
"netbox_routing_protocols/graphql/types_mixin.py" = ["F821", ]
"netbox_routing_protocols/tests/base.py" = ["SIM114", "PLW0127", "BLE001", ]
"netbox_routing_protocols/migrations/*" = ["E501"]

[format]
quote-style = "single"
