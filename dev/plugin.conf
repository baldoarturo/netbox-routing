# shellcheck shell=bash
# The only plugin-specific file of the dev scripts: the rest of dev/ is generic
# and can be copied to another NetBox plugin as is. Edit this file for the new
# plugin, see dev/README.md. Every value can be overridden from the environment.

# Python module of the plugin (also its Django app), as listed in PLUGINS
: "${PLUGIN_MODULE:=netbox_routing_protocols}"

# Database dev/run.sh creates and uses; nothing else is ever dropped or migrated
: "${PLUGIN_DEV_DB:=netbox_routing_protocols_dev}"

# Tag of netbox-community/netbox cloned when the NetBox directory does not exist
: "${NETBOX_REF:=v4.7.4}"

# A quick test (any test label) that dev/test.sh runs once to build the migrated
# template database
: "${TEMPLATE_TEST:=netbox_routing_protocols.tests.test_urls}"

# Git ref the template database is built from: the migrations of the main branch
: "${TEMPLATE_REF:=origin/main}"

# dev/test.sh --own: `-k` patterns selecting the hand-written tests (not the
# ones inherited from NetBox's CRUD test classes). Leave empty to disable --own.
: "${OWN_TEST_PATTERNS:=test_models test_forms test_filtersets test_form_meta test_urls migration unique ModelTestCase FormTestCase FilterSetTestCase AuthenticationTestCase InheritanceTestCase}"
